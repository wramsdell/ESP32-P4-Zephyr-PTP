# Experimental SMP on both HP cores (zephyr#120181 + #120082).
# Selected by TREE=smp ./build.sh, which also points ZEPHYR_BASE at the
# ~/zephyr-p4/smp worktrees.
CONFIG_SMP=y

# Per-CPU and per-thread runtime accounting for the `core1` shell command
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
