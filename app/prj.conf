CONFIG_NETWORKING=y
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_UDP=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10

CONFIG_INIT_STACKS=y
CONFIG_PRINTK=y
CONFIG_NET_SHELL=y
CONFIG_LOG_MODE_DEFERRED=y

# Ethernet is needed for PTP
CONFIG_ETH_DRIVER=y

CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_SETTINGS=y

# First ethernet interface will use these settings
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.40.101"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.40.50"

# PTP settings
CONFIG_PTP_CLOCK=y
CONFIG_PTP=y
CONFIG_PTP_ANNOUNCE_RECV_TIMEOUT=5
CONFIG_PTP_LOG_LEVEL_DBG=y
CONFIG_PTP_DSCP_HIGH_PRIORITY=y

# PTP sample settings
CONFIG_NET_SHELL_PTP_SUPPORTED=y
CONFIG_PTP_CLOCK_SHELL=y
CONFIG_NET_SAMPLE_RUN_DURATION=0
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Bring-up/debug helpers
CONFIG_MDIO_SHELL=y
CONFIG_DEVMEM_SHELL=y
