# Linux grandmaster for the Zephyr boards: PTPv2 over UDP/IPv4, E2E.
# The interface must not be a bridge (br0 has no software TX timestamps and
# ptp4l refuses it).  usage: sudo ptp4l -f ptp4l-udp-master.conf -i <nic> -m
[global]
network_transport       UDPv4
time_stamping           software
delay_mechanism         E2E
masterOnly              1
priority1               10
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
# Zephyr's hybrid mode sends Delay_Req unicast; answer unicast too.
hybrid_e2e              1
